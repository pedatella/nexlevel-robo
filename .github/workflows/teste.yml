name: Teste rápido (sem Claude)

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programas
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ttf-mscorefonts-installer > /dev/null
          pip install -q -r requirements.txt
          fc-list | grep -i "arial black" | head -1
      - name: TikTok (só lê a conta)
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: cd ferramentas && python3 tiktok_envio.py testar
      - name: Twitch e Kick
        run: |
          cd ferramentas
          python3 corte.py clipes alanzoka 7 | head -3
          python3 corte.py clipes kick:coringa 7 | head -3
          S=$(python3 corte.py clipes kick:coringa 7 | head -1 | awk -F' [|] ' '{print $4}')
          python3 corte.py baixar /tmp/t kick:coringa "$S"
          ls -la /tmp/t/brutos
