name: Teste rápido (sem Claude)

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation > /dev/null
          pip install -q -r requirements.txt
          fc-list | grep -i "liberation sans" | head -1
      - name: Lives gravadas (picos de jogo)
        run: |
          cd ferramentas
          python3 corte.py live paulinholokobr 6
          git -C .. checkout -- marca 2>/dev/null || true
