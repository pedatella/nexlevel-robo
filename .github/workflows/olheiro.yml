name: Olheiro de streamers

on:
  schedule:
    - cron: "37 11 * * 1"   # segunda, 8h37 Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corte
  cancel-in-progress: false

jobs:
  olheiro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Pedidos do Lucas no Telegram (bloquear)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ferramentas/bloqueios.py || true
      - name: Procurar streamers em alta
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ferramentas/olheiro.py 2
      - name: Guardar
        if: always()
        run: |
          git config user.name "robo-nexlevel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A marca estado
          git diff --cached --quiet || git commit -q -m "olheiro $(date +%F)"
          git pull -q --rebase && git push -q
