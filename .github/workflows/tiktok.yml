name: Conferir conta do TikTok

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corte
  cancel-in-progress: false

jobs:
  conta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Qual conta recebe os vídeos
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          cd ferramentas && python3 - <<'PY'
          import requests, tiktok_envio as t
          tk = t.token()
          u = requests.get(t.API + "/v2/user/info/?fields=display_name,username,open_id", timeout=60,
                           headers={"Authorization": f"Bearer {tk}"}).json()
          print("conta:", (u.get("data") or {}).get("user", {}).get("display_name"), "@" + str((u.get("data") or {}).get("user", {}).get("username")), "| erro:", (u.get("error") or {}).get("code"))
          e = t.ler_estado(); print("escopos:", e.get("scope"), "| expira:", e.get("expira_em"))
          PY
      - name: Guardar token renovado
        if: always()
        run: |
          git config user.name "robo-nexlevel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado && (git diff --cached --quiet || git commit -q -m "token tiktok") && git pull -q --rebase && git push -q
