name: Corte NexLevel

on:
  schedule:
    - cron: "17 12 * * *"  # 9h17 Brasília (rascunho chega antes das 11h, mesmo com atraso do GitHub)
    - cron: "17 18 * * *"  # 15h17 Brasília (antes das 17h)
    - cron: "17 22 * * *"  # 19h17 Brasília (antes das 21h)
    # reservas: o GitHub às vezes pula um disparo (aconteceu em 27/11 às 15h17).
    # Cada faixa tem 2 reservas (30 e 60 min depois). Elas só cortam se a faixa ainda não teve corte.
    - cron: "47 12 * * *"
    - cron: "17 13 * * *"
    - cron: "47 18 * * *"
    - cron: "17 19 * * *"
    - cron: "47 22 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: corte
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      rodar: ${{ steps.c.outputs.rodar }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
        run: |
          rodar=true
          if [ -n "$CRON" ]; then
            # faixa do horário: 12h, 18h ou 22h UTC (9h, 15h, 19h Brasília); o primeiro disparo que chegar faz o corte
            H=$(date -u +%H); case "$H" in 12|13) F=12;; 18|19) F=18;; 22|23) F=22;; *) F=$H;; esac
            desde="$(date -u +%Y-%m-%d)T${F}:00:00Z"
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w cortes.yml -L 30 --json databaseId,createdAt,updatedAt,status,conclusion \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .createdAt >= \"$desde\" and (.status != \"completed\" or (.conclusion == \"success\" and ((.updatedAt|fromdateiso8601) - (.createdAt|fromdateiso8601)) > 150)))] | length")
            [ "$n" -gt 0 ] && rodar=false
            echo "faixa desde $desde: $n execução(ões) -> rodar=$rodar"
          fi
          echo "rodar=$rodar" >> "$GITHUB_OUTPUT"

  corte:
    needs: checar
    if: needs.checar.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Programas (ffmpeg, fontes, Python, Claude)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation > /dev/null
          pip install -q -r requirements.txt
          npm install -g @anthropic-ai/claude-code > /dev/null

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Pedidos do Lucas no Telegram (bloquear)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ferramentas/bloqueios.py || true

      - name: Diretor de cortes
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          mkdir -p cortes
          # até 3 tentativas; nunca repete depois que um vídeo já foi enviado ao TikTok (legenda.txt existe)
          for tentativa in 1 2 3; do
            timeout 50m claude -p "$(cat ferramentas/prompt.md)" \
              --permission-mode acceptEdits \
              --allowedTools "Bash" "Read" "Write" "Edit" "Glob" "Grep" \
              > saida.txt 2> erro.txt || true
            ls cortes/*/legenda.txt > /dev/null 2>&1 && break
            [ -s resumo.md ] && ! grep -q "^# FALHOU" resumo.md && break
            [ "$tentativa" = 3 ] && break
            echo "tentativa $tentativa não enviou vídeo; nova tentativa em 5 min"
            tail -c 1500 saida.txt; tail -c 1500 erro.txt
            rm -rf cortes/* resumo.md
            git checkout -- marca/usados.md 2>/dev/null || true
            sleep 300
          done
          if [ ! -s resumo.md ]; then
            L=$(ls cortes/*/legenda.txt 2>/dev/null | head -1)
            if [ -n "$L" ]; then
              { echo "# $(basename "$(dirname "$L")") · enviado ao TikTok (resumo automático)"; echo; echo '```'; cat "$L"; echo; echo '```'; } > resumo.md
            else
              { echo "# FALHOU: o diretor não terminou depois de 3 tentativas"; echo; echo '```'; tail -c 2500 saida.txt; tail -c 1500 erro.txt; echo '```'; } > resumo.md
            fi
          fi
          cat resumo.md

      - name: Vídeo para baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corte
          path: |
            cortes/*/*.mp4
            cortes/*/qa.jpg
            cortes/*/tira.jpg
            cortes/*/legenda.txt
            cortes/*/corte.json
            cortes/*/brutos/*.canal.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Guardar estado (clipes usados, token do TikTok, resumo)
        if: always()
        run: |
          D=$(TZ=America/Sao_Paulo date +%Y-%m-%d_%H%M)
          [ -f resumo.md ] && cp resumo.md "resumos/$D.md"
          git config user.name "robo-nexlevel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A marca estado resumos
          git diff --cached --quiet || git commit -q -m "corte $D"
          git pull -q --rebase && git push -q

      - name: Registro do corte (issue, sem e-mail)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=$(head -1 resumo.md | sed 's/^# //')
          { cat resumo.md; echo; echo "🎬 Vídeo e prévia: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > aviso.md
          gh issue create --title "$T" --body-file aviso.md   # registro silencioso (sem e-mail); o aviso vai pelo Telegram

      - name: Avisar no Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "Telegram não configurado"; exit 0; }
          [ -s resumo.md ] || printf '# FALHOU: o robô parou antes de terminar (erro técnico)\n\nVou tentar de novo no horário reserva.\n' > resumo.md
          if grep -q "FALHOU" <(head -1 resumo.md); then
            { head -3 resumo.md | sed 's/^# /⚠️ NexLevel /'; echo; echo "Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > tg.txt
          else
            { head -1 resumo.md | sed 's/^# /🎬 NexLevel: /'; echo; echo "Já está nos rascunhos do seu TikTok. Legenda para colar:"; echo; sed -n '/^```/,/^```/p' resumo.md | grep -v '^```'; echo; echo "Ver o vídeo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > tg.txt
          fi
          curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text@tg.txt" -d disable_web_page_preview=true -o /dev/null -w "Telegram HTTP %{http_code}\n" || true
          # o próprio vídeo também vai no Telegram: se o TikTok esconder o rascunho, é só salvar e postar
          bash ferramentas/telegram_video.sh cortes/*/corte-*.mp4 || true
