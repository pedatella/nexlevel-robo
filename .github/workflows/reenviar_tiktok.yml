name: Reenviar corte ao TikTok

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Número da execução do corte"
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: corte
  cancel-in-progress: false

jobs:
  reenviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Baixar o vídeo daquela execução
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n corte -D corte
      - name: Mandar ao TikTok
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          V=$(ls corte/*/corte-*.mp4 | head -1); echo "vídeo: $V"
          cd ferramentas && python3 -c "import tiktok_envio as t, sys; print('TikTok:', t.enviar_rascunho(sys.argv[1]))" "../$V"
      - name: Guardar token renovado
        if: always()
        run: |
          git config user.name "robo-nexlevel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado && (git diff --cached --quiet || git commit -q -m "token tiktok") && git pull -q --rebase && git push -q
