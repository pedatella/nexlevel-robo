name: Teste do aviso por e-mail

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - name: Abre aviso como o robô
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R ${{ github.repository }} --title "Teste: aviso do robô NexLevel" \
            --body "@pedatella se este aviso chegou no seu e-mail, os próximos cortes chegam do mesmo jeito, com a legenda pronta." \
            --assignee pedatella
